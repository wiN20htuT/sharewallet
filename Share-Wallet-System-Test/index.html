<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Shared Wallet Login & Register</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        h2 { color: #1e293b; margin-bottom: 1.5rem; }
        .input-group { position: relative; margin: 8px 0; }
        input { width: 100%; padding: 12px; padding-right: 40px; border: 1px solid #e2e8f0; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; padding: 4px; width: 32px; height: 28px; display: flex; align-items: center; justify-content: center; }
        .toggle-password:hover { color: #4f46e5; background: #f5f3ff; border-color: #4f46e5; }
        .toggle-password:active { transform: translateY(-50%) scale(0.95); }
        .error-message { color: #ef4444; font-size: 13px; margin: 8px 0 0 0; text-align: left; min-height: 18px; }
        .btn-group { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .btn-login { background: #4f46e5; color: white; }
        .btn-login:hover { background: #4338ca; }
        .btn-register { background: white; color: #4f46e5; border: 1px solid #4f46e5; }
        .btn-register:hover { background: #f5f3ff; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .loading-content { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), 0 0 0 10px rgba(79,70,229,0.2), inset 0 0 20px rgba(0,0,0,0.1); transform: perspective(1000px) rotateX(10deg) rotateY(-5deg); animation: float 2s ease-in-out infinite, pulse 2s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: perspective(1000px) rotateX(10deg) rotateY(-5deg) translateY(0); } 50% { transform: perspective(1000px) rotateX(15deg) rotateY(5deg) translateY(-20px); } }
        @keyframes pulse { 0%, 100% { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), 0 0 0 10px rgba(79,70,229,0.2), inset 0 0 20px rgba(0,0,0,0.1); } 50% { box-shadow: 0 35px 60px -12px rgba(0,0,0,0.6), 0 0 0 15px rgba(79,70,229,0.3), inset 0 0 30px rgba(79,70,229,0.2); } }
        .spinner { width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top: 4px solid #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #1e293b; font-weight: 600; margin: 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Shared Wallet</h2>
        <input type="email" id="email" placeholder="Email">
        <div class="input-group">
            <input type="password" id="password" placeholder="Password (Min 6 chars)">
            <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                <span class="eye-icon">👁️</span>
            </button>
        </div>
        <p id="errorMessage" class="error-message"></p>
        
        <div class="btn-group">
            <button class="btn-login" onclick="handleLogin()">Login</button>
            <button class="btn-register" onclick="handleRegister()">Register အကောင့်ဖွင့်မည်</button>
        </div>
    </div>
    
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p class="loading-text">Processing...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBBc-raJ2RfLOXHSyAZhYYzYJhSuFI37PM",
            authDomain: "share-wallet-c7ff8.firebaseapp.com",
            projectId: "share-wallet-c7ff8",
            storageBucket: "share-wallet-c7ff8.firebasestorage.app",
            messagingSenderId: "694101492185",
            appId: "1:694101492185:web:8c5205395ffeed193ed9c8",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.togglePassword = function() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.querySelector('.eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = '🔒';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = '👁️';
            }
        };

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
        }

        window.handleRegister = function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            showError('');
            if(!email || !password) return showError("Email နှင့် Password ဖြည့်ပါ");
            if(password.length < 6) return showError("Password အနည်းဆုံး ၆ လုံးရှိရပါမည်");

            showLoading();
            createUserWithEmailAndPassword(auth, email, password)
                .then(() => {
                    hideLoading();
                    showError('');
                    alert("Register အောင်မြင်ပါသည်! အခု Login ဝင်နိုင်ပါပြီ။");
                })
                .catch((error) => {
                    hideLoading();
                    showError("Error: " + error.message);
                });
        };

        window.handleLogin = function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            showError('');
            if(!email || !password) return showError("ဖြည့်စွက်ပေးပါ");

            showLoading();
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    hideLoading();
                    window.location.href = "dashboard-v2.html";
                })
                .catch((error) => {
                    hideLoading();
                    showError("Login မအောင်မြင်ပါဟုတ်ပါက: " + error.message);
                });
        };
    </script>
</body>
</html>

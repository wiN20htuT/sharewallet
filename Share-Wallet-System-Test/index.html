<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared Wallet - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page login-page">
    <div class="auth-tools">
        <button id="themeToggle" class="theme-toggle" data-theme-toggle type="button">Light Mode</button>
    </div>

    <div class="card login-card">
        <h2>Shared Wallet</h2>
        <input type="email" id="email" placeholder="Email">
        <div class="input-group">
            <input type="password" id="password" placeholder="Password (Min 6 chars)">
            <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                <svg class="eye-icon eye-open" style="display:none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-icon eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 4.63"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            </button>
        </div>
        <p id="errorMessage" class="error-message"></p>
        
        <div class="btn-group">
            <button class="btn-login" onclick="handleLogin()">Login</button>
            <button class="btn-link" onclick="navigateWithLoading('register.html')">Create Account</button>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p class="loading-text">Processing...</p>
        </div>
    </div>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // *** Important: Get this config from Firebase Console and keep it secure ***
        const firebaseConfig = {
            apiKey: "AIzaSyBBc-raJ2RfLOXHSyAZhYYzYJhSuFI37PM",
            authDomain: "share-wallet-c7ff8.firebaseapp.com",
            projectId: "share-wallet-c7ff8",
            storageBucket: "share-wallet-c7ff8.firebasestorage.app",
            messagingSenderId: "694101492185",
            appId: "1:694101492185:web:8c5205395ffeed193ed9c8",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        function applyTheme(theme) {
            const nextTheme = theme === 'light' ? 'light' : 'dark';
            document.body.classList.toggle('light-mode', nextTheme === 'light');
            localStorage.setItem('shareWalletTheme', nextTheme);
            document.getElementById('themeToggle').textContent = nextTheme === 'light' ? 'Dark Mode' : 'Light Mode';
        }

        applyTheme(localStorage.getItem('shareWalletTheme') || 'dark');
        document.getElementById('themeToggle').addEventListener('click', () => {
            applyTheme(document.body.classList.contains('light-mode') ? 'dark' : 'light');
        });

        window.togglePassword = function() {
            const passwordInput = document.getElementById('password');
            const eyeOpen = document.querySelector('.eye-open');
            const eyeClosed = document.querySelector('.eye-closed');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            } else {
                passwordInput.type = 'password';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            }
        };

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        window.navigateWithLoading = function(url) {
            showLoading();
            setTimeout(() => {
                window.location.href = url;
            }, 120);
        };

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
        }

        window.handleLogin = function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            showError('');
            if(!email || !password) return showError("Please fill in Email and Password");

            showLoading();
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    showError('');
                    window.location.href = "personal-dashboard.html";
                })
                .catch((error) => {
                    hideLoading();
                    showError("Login failed: " + error.message);
                });
        };
    </script>
</body>
</html>

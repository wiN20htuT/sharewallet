<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Shared Wallet Login & Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="card login-card">
        <h2>Shared Wallet</h2>
        <input type="email" id="email" placeholder="Email">
        <div class="input-group">
            <input type="password" id="password" placeholder="Password (Min 6 chars)">
            <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>
        <p id="errorMessage" class="error-message"></p>
        
        <div class="btn-group">
            <button class="btn-login" onclick="handleLogin()">Login</button>
            <button class="btn-register" onclick="handleRegister()">Register အကောင့်ဖွင့်မည်</button>
        </div>
    </div>
    
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p class="loading-text">Processing...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBBc-raJ2RfLOXHSyAZhYYzYJhSuFI37PM",
            authDomain: "share-wallet-c7ff8.firebaseapp.com",
            projectId: "share-wallet-c7ff8",
            storageBucket: "share-wallet-c7ff8.firebasestorage.app",
            messagingSenderId: "694101492185",
            appId: "1:694101492185:web:8c5205395ffeed193ed9c8",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.togglePassword = function() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.querySelector('.eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.76-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            }
        };

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
        }

        window.handleRegister = function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            showError('');
            if(!email || !password) return showError("Email နှင့် Password ဖြည့်ပါ");
            if(password.length < 6) return showError("Password အနည်းဆုံး ၆ လုံးရှိရပါမည်");

            showLoading();
            createUserWithEmailAndPassword(auth, email, password)
                .then(() => {
                    hideLoading();
                    showError('');
                    alert("Register အောင်မြင်ပါသည်! အခု Login ဝင်နိုင်ပါပြီ။");
                })
                .catch((error) => {
                    hideLoading();
                    showError("Error: " + error.message);
                });
        };

        window.handleLogin = function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            showError('');
            if(!email || !password) return showError("ဖြည့်စွက်ပေးပါ");

            showLoading();
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    hideLoading();
                    window.location.href = "dashboard-v2.html";
                })
                .catch((error) => {
                    hideLoading();
                    showError("Login မအောင်မြင်ပါဟုတ်ပါက: " + error.message);
                });
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Professional Shared Wallet</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="user-profile">
            <div class="profile-info">
                <img id="userImg" src="https://ui-avatars.com/api/?name=User&background=random" alt="Profile">
                <div>
                    <div id="userNameDisplay" class="profile-name">Loading...</div>
                    <div id="userEmailDisplay" class="profile-email">email@example.com</div>
                </div>
            </div>
        </div>

        <div class="balance-card">
            <small id="walletName">Loading Wallet...</small>
            <h1 id="totalBalance">0 Ks</h1>
        </div>

        <button id="toggleFormBtn" onclick="toggleForm()" class="btn btn-primary">
            + Add New Record
        </button>

        <div id="transactionForm" class="card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h6 style="margin:0">Add Record</h6>
                <button onclick="toggleForm()" style="background:none; border:none; color:gray; cursor:pointer;">✖</button>
            </div>
            <input type="number" id="amount" placeholder="Amount">
            <input type="text" id="note" placeholder="Note">
            <select id="transactionType">
                <option value="expense">Expense (Withdraw)</option>
                <option value="income">Income/Undetermined (Deposit)</option>
            </select>
            <button onclick="addTransaction()" class="btn btn-success">Save</button>
        </div>

        <div class="card">
            <h6 style="margin-top:0">Member Balances</h6>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Contributed</th>
                            <th>Spent</th>
                            <th>Balance</th>
                        </tr>
                    </thead>
                    <tbody id="memberStatsTable"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h6 style="margin-top:0">Transaction History</h6>
            <div class="table-responsive table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Type</th>
                            <th style="text-align:right">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="transactionHistoryTable"></tbody>
                </table>
            </div>
        </div>

        <div class="filter-group">
            <button class="filter-btn active" id="btn-all" onclick="loadData('all')">All</button>
            <button class="filter-btn" id="btn-today" onclick="loadData('today')">Today</button>
            <button class="filter-btn" id="btn-month" onclick="loadData('month')">This Month</button>
        </div>

        <button id="toggleFormbtn" onclick="toggleForm1()" class="btn btn-primary">Invite Members</button>
        <div id="inviteform" class="card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h6 style="margin:0">Invite Member</h6>
                <button onclick="toggleForm1()" style="background:none; border:none; color:gray; cursor:pointer;">✖</button>
            </div>
            <input type="email" id="inviteEmail" placeholder="Friend's Email">
            <button class="btn btn-info" onclick="inviteMember()">Invite & Send Email</button>
        </div>

        <button onclick="logout()" style="width:100%; background:none; border:none; color:red; cursor:pointer; margin-top:10px; padding:20px">Logout</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBBc-raJ2RfLOXHSyAZhYYzYJhSuFI37PM",
                authDomain: "share-wallet-c7ff8.firebaseapp.com",
                projectId: "share-wallet-c7ff8",
                storageBucket: "share-wallet-c7ff8.firebasestorage.app",
                messagingSenderId: "694101492185",
                appId: "1:694101492185:web:8c5205395ffeed193ed9c8",
                
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentWalletId = null;
        let memberStatsData = {}; 
        let globalWalletBalance = 0; // Negative value check အတွက်

        // ၁။ Logic Fix: အဖွဲ့ဝင်လက်ကျန်ဇယား (Negative Balance Fix)
        async function updateMemberStatsV2() {
            if (!currentWalletId) return;
            const transactionsSnapshot = await getDocs(query(collection(db, "transactions"), where("walletId", "==", currentWalletId)));
            const membersSnapshot = await getDocs(query(collection(db, "wallet_members"), where("walletId", "==", currentWalletId)));

            memberStatsData = {};
            globalWalletBalance = 0;

            // Members initialization
            membersSnapshot.forEach(doc => {
                const email = doc.data().memberEmail || doc.data().userEmail;
                if (email) memberStatsData[email] = { contributed: 0, spent: 0 };
            });

            // Transactions calculation
            transactionsSnapshot.forEach(doc => {
                const d = doc.data();
                const amt = Number(d.amount);
                if (!memberStatsData[d.userEmail]) {
                    memberStatsData[d.userEmail] = { contributed: 0, spent: 0 };
                }

                if (d.type === 'income') {
                    memberStatsData[d.userEmail].contributed += amt;
                    globalWalletBalance += amt;
                } else {
                    memberStatsData[d.userEmail].spent += amt;
                    globalWalletBalance -= amt;
                }
            });

            document.getElementById('totalBalance').innerText = globalWalletBalance.toLocaleString() + " Ks";

            const tbody = document.getElementById('memberStatsTable');
            tbody.innerHTML = '';
            for (const email in memberStatsData) {
                const { contributed, spent } = memberStatsData[email];
                const balance = contributed - spent;
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${email.split('@')[0].toUpperCase()}</strong></td>
                        <td>${contributed.toLocaleString()}</td>
                        <td>${spent.toLocaleString()}</td>
                        <td style="color:${balance < 0 ? 'red':'green'}; font-weight:bold">${balance.toLocaleString()} Ks</td>
                    </tr>`;
            }
        }

        // ၂။ Form Toggles (Fix Bug: form1 variable correctly mapped)
        window.toggleForm = function() {
            const form = document.getElementById('transactionForm');
            const btn = document.getElementById('toggleFormBtn');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
            btn.style.display = form.style.display === 'none' ? 'block' : 'none';
        };

        window.toggleForm1 = function() {
            const form1 = document.getElementById('inviteform');
            const btn1 = document.getElementById('toggleFormbtn');
            form1.style.display = form1.style.display === 'none' ? 'block' : 'none';
            btn1.style.display = form1.style.display === 'none' ? 'block' : 'none';
        };

        // ၃။ Logic Fix: Negative Value Check
        window.addTransaction = async function() {
            const amount = Number(document.getElementById('amount').value);
            const note = document.getElementById('note').value;
            const type = document.getElementById('transactionType').value;
            const userEmail = auth.currentUser.email;

            if (!amount || !note) return alert("Please fill in Amount and Note");

            if (type === 'expense' && amount > globalWalletBalance) {
                return alert(`Insufficient balance. (Current balance: ${globalWalletBalance.toLocaleString()} Ks)`);
            }

            try {
                await addDoc(collection(db, "transactions"), {
                    amount, note, type, timestamp: new Date(), userEmail, walletId: currentWalletId
                });
                document.getElementById('amount').value = '';
                document.getElementById('note').value = '';
                await updateMemberStatsV2();
                await loadData('all');
                toggleForm();
            } catch (e) { alert(e.message); }
        };

        // ၄။ Data Load & Display
        window.loadData = async function(filter) {
            if (!currentWalletId) return;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if(document.getElementById('btn-' + filter)) document.getElementById('btn-' + filter).classList.add('active');

            const q = query(collection(db, "transactions"), where("walletId", "==", currentWalletId), orderBy("timestamp", "desc"));
            const querySnapshot = await getDocs(q);
            const now = new Date();
            let filteredData = [];

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if (!data.timestamp) return;
                const txDate = data.timestamp.toDate();

                if (filter === 'today' && txDate.toDateString() === now.toDateString()) filteredData.push(data);
                else if (filter === 'month' && txDate.getMonth() === now.getMonth() && txDate.getFullYear() === now.getFullYear()) filteredData.push(data);
                else if (filter === 'all') filteredData.push(data);
            });
            displayTransactionsTable(filteredData);
        };

        function displayTransactionsTable(dataArray) {
            const historyBody = document.getElementById('transactionHistoryTable');
            historyBody.innerHTML = '';
            dataArray.forEach(data => {
                const date = data.timestamp ? data.timestamp.toDate().toLocaleString('en-GB') : '-';
                const name = data.userEmail ? data.userEmail.split('@')[0].toUpperCase() : '-';
                const isIncome = data.type === 'income';
                historyBody.innerHTML += `
                    <tr>
                        <td><small>${date}</small></td>
                        <td><strong>${name}</strong></td>
                        <td>${data.note}</td>
                        <td><span class="badge ${isIncome ? 'bg-success' : 'bg-danger'}">${isIncome ? 'Income' : 'Expense'}</span></td>
                        <td style="text-align:right; font-weight:bold; color:${isIncome ? 'green':'red'}">
                            ${isIncome ? '+' : '-'}${Number(data.amount).toLocaleString()} Ks
                        </td>
                    </tr>`;
            });
        }

window.inviteMember = async function() {
            const email = document.getElementById('inviteEmail').value;
            if(!email) return alert("Please enter Email");
            try {
                await addDoc(collection(db, "wallet_members"), { walletId: currentWalletId, memberEmail: email, invitedBy: auth.currentUser.email, timestamp: new Date() });
                emailjs.init("JVOsK8u42vh1Tr6FQ");
                emailjs.send('service_3elf14c', 'template_37j2nbj', { invite_email: email, from_name: auth.currentUser.email })
                .then(() => alert("Email sent successfully."));
            } catch (e) { alert(e.message); }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const name = user.email.split('@')[0].toUpperCase();
                document.getElementById('userNameDisplay').innerText = name;
                document.getElementById('userEmailDisplay').innerText = user.email;
                document.getElementById('userImg').src = `https://ui-avatars.com/api/?name=${name}&background=random&color=fff`;

                const qInvite = query(collection(db, "wallet_members"), where("memberEmail", "==", user.email));
                const snapInvite = await getDocs(qInvite);
                
                if (!snapInvite.empty) {
                    currentWalletId = snapInvite.docs[0].data().walletId;
                    document.getElementById('walletName').innerText = "Shared Wallet Access";
                } else {
                    currentWalletId = "wallet_" + user.uid;
                    document.getElementById('walletName').innerText = "Personal Wallet";
                }
                
                await updateMemberStatsV2();
                await loadData('all');
            } else {
                window.location.href = "index.html";
            }
        });

        window.logout = () => signOut(auth);
    </script>
</body>
</html>

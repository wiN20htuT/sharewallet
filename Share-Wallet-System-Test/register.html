<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Shared Wallet - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Create Account</h2>
        <input type="email" id="email" placeholder="Email">
        <div class="input-group">
            <input type="password" id="password" placeholder="Password (Min 6 chars)">
            <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                <svg class="eye-icon eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-icon eye-closed" style="display:none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 4.63"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            </button>
        </div>
        <p id="errorMessage" class="error-message"></p>
        
        <div class="btn-group">
            <button class="btn-register" onclick="handleRegister()">Create Account</button>
            <button class="btn-link" onclick="window.location.href='index.html'">Already have an account? Login</button>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div class="loading-content" style="text-align: center; color: white;">
            <div class="spinner" style="border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px;"></div>
            <p class="loading-text">Processing...</p>
        </div>
    </div>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // *** Important: Get this config from Firebase Console and keep it secure ***
        const firebaseConfig = {
            apiKey: "AIzaSyBBc-raJ2RfLOXHSyAZhYYzYJhSuFI37PM",
            authDomain: "share-wallet-c7ff8.firebaseapp.com",
            projectId: "share-wallet-c7ff8",
            storageBucket: "share-wallet-c7ff8.firebasestorage.app",
            messagingSenderId: "694101492185",
            appId: "1:694101492185:web:8c5205395ffeed193ed9c8",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.togglePassword = function() {
            const passwordInput = document.getElementById('password');
            const eyeOpen = document.querySelector('.eye-open');
            const eyeClosed = document.querySelector('.eye-closed');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                passwordInput.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        };

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
        }

        window.handleRegister = function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            showError('');
            if(!email || !password) return showError("Please fill in Email and Password");
            if(password.length < 6) return showError("Password must be at least 6 characters");

            showLoading();
            createUserWithEmailAndPassword(auth, email, password)
                .then(() => {
                    hideLoading();
                    showError('');
                    alert("Registration successful! You can now login.");
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    hideLoading();
                    console.error(error);
                    showError("Registration failed: " + error.message);
                });
        };
    </script>
</body>
</html>

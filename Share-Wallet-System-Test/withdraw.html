<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared Wallet - Withdraw</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-tools">
        <button id="themeToggle" class="theme-toggle" data-theme-toggle type="button">Light Mode</button>
    </div>

    <div class="body-back-tools">
        <button class="btn btn-link back-arrow" onclick="WalletApp.navigateWithLoading('personal-dashboard.html')">Personal Dashboard</button>
    </div>

    <div class="logout-tools">
        <button id="logoutBtn" class="btn-logout" type="button">Logout</button>
    </div>

    <main class="container wallet-form">
        <div class="dashboard-header split-header">
            <h2 class="dashboard-title">Withdraw Money</h2>
        </div>

        <section class="balance-card">
            <small>Total Shared Balance</small>
            <h1 id="totalBalance">0 Ks</h1>
        </section>

        <form id="withdrawForm" class="card">
            <h6>Withdraw Details</h6>
            <p id="withdrawInfo" class="form-meta">Withdraw is available after you deposit 10,000 Ks.</p>
            <input type="number" id="amount" min="1" placeholder="Amount in Kyats">
            <textarea id="description" placeholder="Description / what for"></textarea>
            <p id="formError" class="form-error"></p>
            <div class="form-footer">
                <button type="submit" class="btn btn-primary">Save Withdraw</button>
                <button type="button" class="btn btn-link" onclick="WalletApp.navigateWithLoading('personal-dashboard.html')">Cancel</button>
            </div>
        </form>
    </main>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p class="loading-text">Saving withdraw...</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="wallet-app.js"></script>
    <script>
        const {
            requireUser,
            getTransactions,
            getSharedBalance,
            getUserDepositTotal,
            canUserWithdraw,
            saveTransaction,
            formatKs,
            MIN_DEPOSIT_FOR_WITHDRAW,
            initTheme,
            toggleTheme,
            logout,
            navigateWithLoading,
            showAlert
        } = window.WalletApp;

        const loadingOverlay = document.getElementById("loadingOverlay");
        const errorMessage = document.getElementById("formError");
        const withdrawForm = document.getElementById("withdrawForm");
        let currentUser = null;
        let withdrawUnlocked = false;

        function showLoading() {
            loadingOverlay.style.display = "flex";
        }

        function hideLoading() {
            loadingOverlay.style.display = "none";
        }

        initTheme();
        document.getElementById("themeToggle").addEventListener("click", toggleTheme);
        document.getElementById("logoutBtn").addEventListener("click", logout);

        requireUser(async (user) => {
            currentUser = user;
            const transactions = await getTransactions();
            const sharedBalance = getSharedBalance(transactions);
            const deposited = getUserDepositTotal(transactions, user);

            withdrawUnlocked = canUserWithdraw(transactions, user);
            document.getElementById("totalBalance").textContent = formatKs(sharedBalance);
            document.getElementById("withdrawInfo").textContent = withdrawUnlocked
                ? `Withdraw is unlocked. Your total deposited amount is ${formatKs(deposited)}.`
                : `Withdraw is locked. Deposit ${formatKs(MIN_DEPOSIT_FOR_WITHDRAW)} first; deposited so far: ${formatKs(deposited)}.`;

            withdrawForm.querySelectorAll("input, textarea, button[type='submit']").forEach((control) => {
                control.disabled = !withdrawUnlocked;
            });
        });

        withdrawForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            errorMessage.textContent = "";

            if (!withdrawUnlocked) {
                errorMessage.textContent = `Please deposit ${formatKs(MIN_DEPOSIT_FOR_WITHDRAW)} before withdrawing.`;
                showAlert(`Please deposit at least ${formatKs(MIN_DEPOSIT_FOR_WITHDRAW)} before you withdraw money.`, "Withdraw Locked");
                return;
            }

            try {
                showLoading();
                await saveTransaction({
                    type: "withdraw",
                    amount: document.getElementById("amount").value,
                    description: document.getElementById("description").value,
                    user: currentUser
                });
                navigateWithLoading("personal-dashboard.html", "Opening dashboard...");
            } catch (error) {
                hideLoading();
                errorMessage.textContent = error.message;
                showAlert(error.message, "Withdraw Not Saved");
            }
        });
    </script>
</body>
</html>

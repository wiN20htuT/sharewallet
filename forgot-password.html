<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared Wallet - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-tools">
        <button id="themeToggle" class="theme-toggle" data-theme-toggle type="button">Light Mode</button>
    </div>

    <form class="card auth-card" onsubmit="handleRequestOtp(event)">
        <h2>Reset Password</h2>
        <p class="auth-status">Enter your email to receive a 6-digit OTP code.</p>
        <input type="email" id="email" placeholder="Email Address" required>
        <p id="errorMessage" class="error-message"></p>

        <div class="btn-group">
            <button id="sendOtpBtn" class="btn-login" type="submit">Send OTP</button>
            <button type="button" class="btn-link" onclick="navigateWithLoading('index.html')">Back to Login</button>
        </div>
    </form>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p class="loading-text">Sending OTP...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="module">
        import { auth, db, emailJsConfig } from "./firebase.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const OTP_EXPIRY_MS = 5 * 60 * 1000;

        function applyTheme(theme) {
            const nextTheme = theme === 'light' ? 'light' : 'dark';
            document.body.classList.toggle('light-mode', nextTheme === 'light');
            localStorage.setItem('shareWalletTheme', nextTheme);
            document.getElementById('themeToggle').textContent = nextTheme === 'light' ? 'Dark Mode' : 'Light Mode';
        }
        applyTheme(localStorage.getItem('shareWalletTheme') || 'dark');
        document.getElementById('themeToggle').addEventListener('click', () => {
            applyTheme(document.body.classList.contains('light-mode') ? 'dark' : 'light');
        });

        function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

        window.navigateWithLoading = function(url) {
            showLoading();
            setTimeout(() => { window.location.href = url; }, 120);
        };

        function showError(message) { document.getElementById('errorMessage').textContent = message; }

        function generateOtp() { return String(Math.floor(100000 + Math.random() * 900000)); }

        async function sendOtpEmail(email, otp) {
            try {
                window.emailjs.init(emailJsConfig.publicKey);
                await window.emailjs.send(
                    emailJsConfig.serviceId,
                    emailJsConfig.templateId,
                    { to_email: email, passcode: otp, time: "5 minutes" },
                    emailJsConfig.publicKey
                );
            } catch (error) {
                throw new Error("Email delivery failed: " + (error?.text || error?.message));
            }
        }

        window.handleRequestOtp = async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) return showError("Please enter your email");

            showError('');
            showLoading();
            try {
                const otp = generateOtp();
                const createdAt = new Date();
                const expiresAt = new Date(createdAt.getTime() + OTP_EXPIRY_MS);

                // Store OTP temporarily for password reset
                await setDoc(doc(db, "passwordResetOtps", email), {
                    email,
                    otp,
                    createdAt,
                    expiresAt,
                    verified: false
                });

                await sendOtpEmail(email, otp);
                sessionStorage.setItem("resetEmail", email);
                window.location.href = "reset-password.html";
            } catch (error) {
                hideLoading();
                showError(error.message);
            }
        };
    </script>
</body>
</html>

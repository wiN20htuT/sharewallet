<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared Wallet - Member Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="dashboard-top-bar">
            <div class="bar-left">
                <button class="btn btn-link back-arrow" onclick="WalletApp.navigateWithLoading('personal-dashboard.html')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>Back</span>
                </button>
            </div>
            <div class="bar-center">
                <h2 class="dashboard-title" style="font-size: 1.5rem; margin: 0;">Member Dashboard</h2>
            </div>
            <div class="bar-right">
                <button id="themeToggle" class="theme-toggle" data-theme-toggle type="button">Light Mode</button>
            </div>
        </div>

        <section class="balance-card">
            <small>Total Shared Balance</small>
            <h1 id="totalBalance">0 Ks</h1>
        </section>

        <section class="card">
            <h6>Shared Activity</h6>
            <div class="table-responsive table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Time</th>
                            <th class="text-right">Amount</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody id="memberHistoryTable"></tbody>
                </table>
            </div>

            <div class="dashboard-bottom-bar">
                <div class="nav-group">
                    <button id="logoutBtn" class="btn-logout">Logout</button>
                </div>
                <div class="nav-group">
                    <div class="radio-filter" aria-label="Filter shared activity">
                        <label><input type="radio" name="memberFilter" value="all" checked> All</label>
                        <label><input type="radio" name="memberFilter" value="deposit"> Deposit</label>
                        <label><input type="radio" name="memberFilter" value="withdraw"> Withdraw</label>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p class="loading-text">Loading members...</p>
        </div>
    </div>

    <script type="module">
        import "./wallet-app.js";

        const {
            requireUser,
            logout,
            getTransactions,
            getSharedBalance,
            formatKs,
            formatDate,
            initTheme,
            toggleTheme
        } = window.WalletApp;

        let allTransactions = [];

        function renderMemberHistory(transactions, filter = "all") {
            const table = document.getElementById("memberHistoryTable");
            const filteredTransactions = transactions.filter((transaction) => {
                const isDeposit = window.WalletApp.isDeposit(transaction);
                if (filter === "deposit") return isDeposit;
                if (filter === "withdraw") return !isDeposit;
                return true;
            });

            if (!filteredTransactions.length) {
                table.innerHTML = `<tr><td colspan="5"><p class="transaction-empty">No shared wallet transactions yet.</p></td></tr>`;
                return;
            }

            table.innerHTML = filteredTransactions.map((transaction) => {
                const isDeposit = window.WalletApp.isDeposit(transaction);
                return `
                    <tr>
                        <td><strong>${transaction.userName || (transaction.userEmail || "Member").split("@")[0].toUpperCase()}</strong></td>
                        <td><span class="badge ${isDeposit ? "bg-success" : "bg-danger"}">${isDeposit ? "Deposit" : "Withdraw"}</span></td>
                        <td>${formatDate(transaction.timestamp)}</td>
                        <td class="text-right ${isDeposit ? "amount-positive" : "amount-negative"}">${isDeposit ? "+" : "-"}${formatKs(transaction.amount)}</td>
                        <td>${transaction.description || transaction.note || "-"}</td>
                    </tr>
                `;
            }).join("");
        }

        initTheme();
        document.getElementById("themeToggle").addEventListener("click", toggleTheme);
        document.getElementById("logoutBtn").addEventListener("click", logout);
        document.querySelectorAll("input[name='memberFilter']").forEach((radio) => {
            radio.addEventListener("change", () => renderMemberHistory(allTransactions, radio.value));
        });

        requireUser(async () => {
            allTransactions = await getTransactions();
            document.getElementById("totalBalance").textContent = formatKs(getSharedBalance(allTransactions));
            renderMemberHistory(allTransactions);
        });
    </script>
</body>
</html>

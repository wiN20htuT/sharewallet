<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared Wallet - Deposit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="dashboard-top-bar">
            <div class="bar-left">
                <button class="btn btn-link back-arrow" onclick="WalletApp.navigateWithLoading('personal-dashboard.html')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg><span>Back</span>
                </button>
            </div>
            <div class="bar-center">
                <h2 class="dashboard-title" style="font-size: 1.5rem; margin: 0;">Deposit Money</h2>
            </div>
            <div class="bar-right">
                <button id="themeToggle" class="theme-toggle" data-theme-toggle type="button">Light Mode</button>
            </div>
        </div>

        <section class="balance-card">
            <small>Total Shared Balance</small>
            <h1 id="totalBalance">0 Ks</h1>
        </section>

        <form id="depositForm" class="card">
            <h6>Deposit Details</h6>
            <p class="form-meta">Description is required so every member can understand the transaction.</p>
            <input type="number" id="amount" min="1" placeholder="Amount in Kyats">
            <textarea id="description" placeholder="Description / what for"></textarea>
            <p id="formError" class="form-error"></p>
            <div class="form-footer">
                <button type="submit" class="btn btn-success">Save Deposit</button>
            </div>

            <div class="dashboard-bottom-bar">
                <div class="nav-group">
                    <button id="logoutBtn" class="btn-logout" type="button">Logout</button>
                </div>
                <div class="nav-group">
                    <button type="button" class="btn btn-link" style="width: auto; min-width: 100px;" onclick="WalletApp.navigateWithLoading('personal-dashboard.html')">Cancel</button>
                </div>
            </div>
        </form>
    </main>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p class="loading-text">Saving deposit...</p>
        </div>
    </div>

    <script type="module">
        import "./wallet-app.js";

        const {
            requireUser,
            getTransactions,
            getSharedBalance,
            saveTransaction,
            formatKs,
            initTheme,
            toggleTheme,
            logout,
            navigateWithLoading,
            showAlert
        } = window.WalletApp;

        const loadingOverlay = document.getElementById("loadingOverlay");
        const errorMessage = document.getElementById("formError");
        let currentUser = null;

        function showLoading() {
            loadingOverlay.style.display = "flex";
        }

        function hideLoading() {
            loadingOverlay.style.display = "none";
        }

        initTheme();
        document.getElementById("themeToggle").addEventListener("click", toggleTheme);
        document.getElementById("logoutBtn").addEventListener("click", logout);

        requireUser(async (user) => {
            currentUser = user;
            const transactions = await getTransactions();
            document.getElementById("totalBalance").textContent = formatKs(getSharedBalance(transactions));
            hideLoading(); // Hide loading overlay after initial data is rendered
        });

        document.getElementById("depositForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            errorMessage.textContent = "";

            try {
                showLoading();
                await saveTransaction({
                    type: "deposit",
                    amount: document.getElementById("amount").value,
                    description: document.getElementById("description").value,
                    user: currentUser
                });
                navigateWithLoading("personal-dashboard.html", "Opening dashboard...");
            } catch (error) {
                hideLoading();
                errorMessage.textContent = error.message;
                showAlert(error.message, "Deposit Not Saved");
            }
        });
    </script>
</body>
</html>
